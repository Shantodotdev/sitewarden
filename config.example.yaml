# SiteWarden Declarative Configuration Example
# Conforms to IEEE Std 830-1998 (SRS Specification)

# Cron schedule expression: 6-field (sec min hour day month weekday) or standard 5-field
schedule: "0 0 6 * * *"

# Concurrency & Resource Limits
browser_concurrency: 2
timeout_seconds: 30
screenshot_dir: "screenshots"

# Automated Alerting & Notifications (Optional)
# alerts:
#   email:
#     enabled: true
#     smtp_host: "smtp.gmail.com"
#     smtp_port: 587
#     encryption: "starttls"        # "starttls" (port 587), "tls" (port 465), or "none" (port 25)
#     username: "alerts@example.com"
#     # ⚠️ SECURITY NOTICE:
#     # Never enter your primary email account password here!
#     # Generate a dedicated 16-character App Password:
#     # - Gmail: https://myaccount.google.com/apppasswords
#     # - Outlook / Office 365: https://account.live.com/proofs/manage/additional
#     # You can also pass via environment: password: "${SITEWARDEN_SMTP_PASSWORD}"
#     password: "xxxx xxxx xxxx xxxx"
#     from: "SiteWarden Sentinel <alerts@example.com>"
#     to:
#       - "devops@example.com"
#     attach_screenshot: true       # Attach captured failure PNG screenshots to alert emails

# Declarative Test Suites
suites:
  - name: "Example Domain Health Check"
    base_url: "https://example.com"
    tests:
      - name: "Verify Homepage Heading and Body"
        steps:
          - action: navigate
            path: "/"
          - action: wait_for_selector
            selector: "h1"
            timeout_ms: 5000
          - action: assert_text
            selector: "h1"
            contains: "Example Domain"
          - action: assert_visible
            selector: "p"

  - name: "Wikipedia Navigation Test"
    base_url: "https://en.wikipedia.org"
    tests:
      - name: "Verify Wikipedia Main Page"
        steps:
          - action: navigate
            path: "/wiki/Main_Page"
          - action: wait_for_selector
            selector: "#mp-welcome"
            timeout_ms: 10000
          - action: assert_visible
            selector: "#mp-welcome"
          - action: assert_text
            selector: "#mp-welcome"
            contains: "Welcome to Wikipedia"
